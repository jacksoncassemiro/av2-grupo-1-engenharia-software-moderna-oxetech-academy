[project]
name = "clinica-backend"
version = "0.1.0"
description = "Sistema de Gestao de Clinica Medica (MVP) - Backend FastAPI"
readme = "../README.md"
# O Docker e o CI rodam 3.12, mas o codigo e compativel com 3.10+ para que
# ninguem da equipe fique travado por causa da versao instalada na maquina.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "freezegun>=1.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: testes unitarios isolados (sem banco)",
    "integration: testes de integracao (usam banco/TestClient)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seeds/*", "alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",   # Depends() no default de parametro e o idioma do FastAPI
    "N818",   # excecoes do dominio sao nomeadas em portugues (CpfDuplicado), sem sufixo Error
]
