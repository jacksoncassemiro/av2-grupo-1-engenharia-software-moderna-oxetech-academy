name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Backend: lint (ruff) + testes unitarios e de integracao
  # ─────────────────────────────────────────────────────────
  backend:
    name: Backend (FastAPI + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://clinica:clinica@localhost:5432/clinica_test
      JWT_SECRET_KEY: chave-de-teste-do-ci
      TIMEZONE: America/Maceio

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatacao (ruff format --check)
        run: ruff format --check .

      - name: Aplicar migracoes
        run: |
          alembic upgrade head
          alembic current

      - name: Testes unitarios (RN01-RN06)
        run: pytest tests/unit -m unit --cov=app --cov-report=term-missing --cov-report=xml

      - name: Testes de integracao
        run: pytest tests/integration -m integration

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # Frontend: lint + typecheck + build + testes (Vitest)
  # ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        # --frozen-lockfile e o modo correto e sera usado a partir do momento em
        # que o yarn.lock estiver commitado. O fallback existe apenas para o
        # primeiro run da equipe, antes do lockfile entrar no repositorio.
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            echo "::warning::yarn.lock ausente - rode 'yarn install' e comite o lockfile."
            yarn install
          fi

      - name: Lint (ESLint)
        run: yarn lint

      - name: Checagem de tipos (tsc)
        run: yarn typecheck

      - name: Testes (Vitest)
        run: yarn test --coverage

      - name: Build de producao
        run: yarn build

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # Docker: garante que o stack sobe em qualquer maquina
  # ─────────────────────────────────────────────────────────
  docker:
    name: Docker Compose sobe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Subir o stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres backend

      - name: Aguardar API responder
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo "API OK"; exit 0; fi
            sleep 5
          done
          echo "API nao respondeu"; docker compose logs backend; exit 1

      - name: Migracoes
        run: |
          docker compose exec -T backend alembic upgrade head
          # Alembic passa em silencio quando versions/ esta vazia e nao cria tabela
          # nenhuma. Este check falha alto em vez de deixar o erro estourar no seed.
          revisao=$(docker compose exec -T backend alembic current 2>/dev/null | tail -1)
          if [ -z "$revisao" ]; then
            echo "::error::Nenhuma revisao aplicada - alembic/versions/ esta vazia?"
            exit 1
          fi
          echo "Revisao aplicada: $revisao"

      - name: Seed idempotente (roda 2x de proposito - ADR-004)
        run: |
          docker compose exec -T backend python -m app.seeds.seed
          docker compose exec -T backend python -m app.seeds.seed

      - name: Derrubar
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────
  # Quality gate: exigido pela protecao de branch
  # ─────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Quality gate reprovado."
            exit 1
          fi
          echo "Quality gate aprovado."
