name: 🛠️ Tarefa técnica
description: Execução de uma User Story já aprovada, ou trabalho de QA, infra ou documentação.
title: "[US-XX] [ÁREA] "
labels: ["tarefa"]
body:
  - type: markdown
    attributes:
      value: |
        **Título no formato:** `[US-XX] [ÁREA] Verbo no infinitivo + descrição curta`
        Exemplo: `[US-08] [BACKEND] Criar rota de solicitação de consulta`

        ## Regra da equipe: a atividade é autocontida

        Quem pegar esta issue precisa conseguir executá-la **sem abrir outro documento**.
        Copie para dentro dos campos abaixo o critério de aceite e o **texto integral** das
        regras de negócio envolvidas. Link para `docs/` é referência complementar, nunca
        pré-requisito.

  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [BACKEND, FRONTEND, QA, INFRA, DOCS]
    validations:
      required: true

  - type: input
    id: us
    attributes:
      label: User Story
      description: Issue guarda-chuva a que esta tarefa pertence. Use "—" para tarefas de processo.
      placeholder: "US-08 (#31)"
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - "Sprint 1 (31/07 – 05/08)"
        - "Sprint 2 (05/08 – 10/08)"
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Uma frase. O que existe no sistema depois que esta tarefa acabar?
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto técnico
      description: |
        Arquivos que serão tocados, endpoint, contrato de entrada e saída, decisão de arquitetura
        aplicável. Backend segue Controller → Service → Repository → Model.
      value: |
        **Arquivos:**
        **Contrato (se for API):**
        ```json
        ```
    validations:
      required: true

  - type: textarea
    id: regras
    attributes:
      label: Regras de negócio a implementar
      description: |
        **Cole o texto completo de cada RN**, não só o ID. Fonte: `docs/01-requisitos.md` §3.
      value: |
        - **RN0X** — <texto integral da regra>
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Copiados da User Story. É o que o PO valida na coluna UAT.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Marque o que se aplica. Item não marcado impede a passagem para Code Review.
      value: |
        - [ ] Código na branch `feature/usXX-descricao`, PR aberto contra `develop`
        - [ ] Teste automatizado citando o ID da RN no nome
        - [ ] `make lint && make test` verdes localmente
        - [ ] CI verde no PR
        - [ ] 1 aprovação em code review
        - [ ] `docs/` atualizado se o comportamento mudou
        - [ ] Item movido no board
    validations:
      required: true

  - type: textarea
    id: como_testar
    attributes:
      label: Como testar
      description: Passo a passo para o revisor e para o QA verificarem, incluindo o caso negativo.
    validations:
      required: true

  - type: input
    id: dependencias
    attributes:
      label: Dependências
      placeholder: "Bloqueada por #12 · Bloqueia #30"
