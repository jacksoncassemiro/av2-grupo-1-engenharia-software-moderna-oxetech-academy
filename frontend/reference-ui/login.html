<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Clínica Médica</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <!-- US-00: Login com campo único "CPF ou E-mail" -->
  <!-- Referência: CA1 (login paciente por CPF), CA2 (CPF com máscara), CA3 (login atendente por e-mail), CA7 (credencial inválida) -->

  <div class="auth-layout">
    <div class="auth-card">
      <!-- Título -->
      <h1 style="font-size:1.375rem; margin-bottom:4px;">Bem-vindo de volta</h1>
      <p class="text-dimmed text-sm" style="margin-bottom:24px;">
        Entre com suas credenciais para acessar o sistema
      </p>

      <!-- Formulário -->
      <form onsubmit="return false">
        <div class="stack gap-md">
          <!-- Campo único: CPF ou E-mail -->
          <div class="input-wrapper">
            <label class="input-label input-required" for="login">CPF ou E-mail</label>
            <input
              id="login"
              class="input"
              type="text"
              placeholder="Digite seu CPF ou e-mail"
              value="529.982.247-25"
            >
            <span class="input-description">
              Paciente: digite o CPF · Atendente: digite o e-mail profissional
            </span>
          </div>

          <!-- Senha -->
          <div class="input-wrapper">
            <label class="input-label input-required" for="senha">Senha</label>
            <input
              id="senha"
              class="input"
              type="password"
              placeholder="Sua senha"
              value="••••••••"
            >
          </div>

          <!-- Botão -->
          <button class="btn btn-primary btn-full btn-lg" type="submit" style="margin-top:8px;">
            Entrar
          </button>
        </div>
      </form>

      <!-- Divider -->
      <div class="divider-label" style="margin:24px 0 16px;">ou</div>

      <!-- Link para primeiro acesso -->
      <div class="text-center">
        <a href="primeiro-acesso.html" class="btn btn-light btn-full" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;">
          <i data-lucide="sparkles" style="width:16px;height:16px;"></i> Primeiro acesso
        </a>
        <p class="text-xs text-dimmed" style="margin-top:8px;">
          Nunca entrou no sistema? Ative seu login pelo CPF
        </p>
      </div>
    </div>
  </div>
