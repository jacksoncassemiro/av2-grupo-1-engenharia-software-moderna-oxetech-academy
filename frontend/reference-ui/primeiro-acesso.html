<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiro Acesso — Clínica Médica</title>
  <link rel="stylesheet" href="assets/styles.css">

<body>
  <!-- US-00: Primeiro acesso — ativação de login ou auto-cadastro -->
  <!-- Referência: CA4 (vinculação por CPF), CA5 (auto-cadastro), CA6 (CPF já tem login) -->

  <div class="auth-layout">
    <div class="auth-card" style="max-width:480px;">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">🏥</div>
        <div>
          <div class="logo-text">Clínica Médica</div>
          <div class="text-xs text-dimmed">Primeiro Acesso</div>
        </div>
      </div>

      <!-- Stepper -->
      <div class="stepper">
        <div class="stepper-step completed">
          <div class="stepper-circle">✓</div>
          <span class="stepper-label">CPF</span>
        </div>
        <div class="stepper-separator completed"></div>
        <div class="stepper-step active">
          <div class="stepper-circle">2</div>
          <span class="stepper-label">Dados</span>
        </div>
      </div>

      <!-- ============================================================= -->
      <!-- ESTADO 1: Paciente encontrado — apenas criar senha (CA4)      -->
      <!-- ============================================================= -->
      <div class="alert alert-success" style="margin-bottom:20px;">
        <span class="alert-icon">✅</span>
        <div>
          <strong>Encontramos seu cadastro, Carlos!</strong><br>
          <span class="text-sm">Crie uma senha para ativar seu login.</span>
        </div>
      </div>

      <form onsubmit="return false">
        <div class="stack gap-md">
          <!-- CPF (readonly) -->
          <div class="input-wrapper">
            <label class="input-label" for="cpf">CPF</label>
            <input id="cpf" class="input" type="text" value="529.982.247-25" disabled
              style="background:var(--gray-1);color:var(--gray-6);">
          </div>

          <!-- Nome (pré-preenchido, readonly) -->
          <div class="input-wrapper">
            <label class="input-label" for="nome">Nome</label>
            <input id="nome" class="input" type="text" value="Carlos Silva" disabled
              style="background:var(--gray-1);color:var(--gray-6);">
          </div>

          <!-- Senha -->
          <div class="input-wrapper">
            <label class="input-label input-required" for="senha">Criar senha</label>
            <input id="senha" class="input" type="password" placeholder="Mínimo 6 caracteres">
          </div>

          <!-- Confirmar senha -->
          <div class="input-wrapper">
            <label class="input-label input-required" for="confirmar-senha">Confirmar senha</label>
            <input id="confirmar-senha" class="input" type="password" placeholder="Repita a senha">
          </div>

          <button class="btn btn-primary btn-full btn-lg" type="submit">
            Ativar meu acesso
          </button>
        </div>
      </form>

      <div class="divider"></div>

      <div class="text-center">
        <a href="login.html" class="text-sm">← Já tenho login, voltar para entrar</a>
      </div>
    </div>
  </div>
