  <!-- US-00: Primeiro acesso — verificar CPF, depois ativar login ou auto-cadastro (ADR-005) -->
  <!-- Sem logo/stepper na AuthShell real: so titulo + descricao + formulario -->

  <div class="auth-layout">
    <div class="auth-card">
      <!-- ===== Passo 1: Verificar CPF ===== -->
      <h1 style="font-size:1.375rem; margin-bottom:4px;">Verificar CPF</h1>
      <p class="text-dimmed text-sm" style="margin-bottom:24px;">
        Informe seu CPF para verificarmos se você já tem cadastro na clínica.
      </p>

      <form onsubmit="return false">
        <div class="stack gap-md">
          <div class="input-wrapper">
            <label class="input-label input-required" for="cpf">CPF</label>
            <input id="cpf" class="input" type="text" placeholder="000.000.000-00">
            <span class="input-description">Pode digitar com ou sem pontos e traço</span>
          </div>
          <button class="btn btn-primary btn-full btn-lg" type="submit">Verificar</button>
        </div>
      </form>

      <p class="text-center text-xs" style="margin-top:24px;">
        <a href="login.html">← Já tenho login, voltar para entrar</a>
      </p>
    </div>
  </div>
